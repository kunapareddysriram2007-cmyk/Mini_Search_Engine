# Mini Search Engine backend configuration
server.port=8080

# UTF-8 everywhere (corpus is UTF-8, later multilingual)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# JSON
spring.jackson.default-property-inclusion=always

# Allow the React/Vite UI (port 8443, 5173, 3000)
app.cors.allowed-origins=http://localhost:8443,http://127.0.0.1:8443,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

logging.level.com.minisearchengine=INFO
